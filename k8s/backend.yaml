apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoc-backend
  namespace: asoc
  labels:
    app: asoc-backend
    component: api-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: asoc-backend
  template:
    metadata:
      labels:
        app: asoc-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: backend
        image: ghcr.io/yourorg/asoc-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9002
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: redis-url
        - name: HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: hmac-secret
        - name: WS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: ws-api-token
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: jwt-secret-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: openai-api-key
              optional: true
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: groq-api-key
              optional: true
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: asoc-secrets
              key: deepseek-api-key
              optional: true
        - name: OPA_URL
          valueFrom:
            configMapKeyRef:
              name: asoc-config
              key: OPA_URL
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: asoc-config
              key: CORS_ORIGINS
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: asoc-config
              key: LLM_PROVIDER
              optional: true
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: asoc-config
              key: LLM_MODEL
              optional: true
        - name: DB_POOL_MIN_SIZE
          valueFrom:
            configMapKeyRef:
              name: asoc-config
              key: DB_POOL_MIN_SIZE
              optional: true
        - name: DB_POOL_MAX_SIZE
          valueFrom:
            configMapKeyRef:
              name: asoc-config
              key: DB_POOL_MAX_SIZE
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 9002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9002
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: asoc-backend
  namespace: asoc
spec:
  selector:
    app: asoc-backend
  ports:
  - protocol: TCP
    port: 9002
    targetPort: 9002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asoc-backend-hpa
  namespace: asoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asoc-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
