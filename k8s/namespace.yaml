apiVersion: v1
kind: Namespace
metadata:
  name: asoc
  labels:
    app.kubernetes.io/part-of: a-soc
    environment: production
---
apiVersion: v1
kind: Secret
metadata:
  name: asoc-secrets
  namespace: asoc
type: Opaque
# In production, use SealedSecrets or External Secrets Operator:
#   kubeseal < raw-secret.yaml > sealed-secret.yaml
# Required keys:
#   postgres-password: <strong-password>
#   hmac-secret: <random-32-char-string>
#   ws-api-token: <random-32-char-string>
#   jwt-secret-key: <random-64-char-string>
#   database-url: <full-postgres-connection-string>
#   redis-url: <full-redis-connection-string>
stringData:
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  hmac-secret: "CHANGE_ME_IN_PRODUCTION"
  ws-api-token: "CHANGE_ME_IN_PRODUCTION"
  jwt-secret-key: "CHANGE_ME_IN_PRODUCTION"
  database-url: "postgresql+asyncpg://asoc_user:CHANGE_ME_IN_PRODUCTION@postgres:5432/asoc_db"
  redis-url: "redis://redis:6379/0"
  openai-api-key: ""
  groq-api-key: ""
  deepseek-api-key: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: asoc-config
  namespace: asoc
data:
  OPA_URL: "http://opa:8181"
  CORS_ORIGINS: "https://asoc.yourdomain.com"
  LOG_LEVEL: "info"
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4"
  DB_POOL_MIN_SIZE: "2"
  DB_POOL_MAX_SIZE: "10"
