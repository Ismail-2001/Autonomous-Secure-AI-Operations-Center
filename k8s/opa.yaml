apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy-config
  namespace: asoc
data:
  action_policy.rego: |
    package asoc.actions

    import rego.v1

    # Default deny all actions
    default allow = false
    default require_approval = false

    # Allow low-risk, non-destructive actions
    allow if {
        input.action.risk_score < 0.5
        input.action.type != "destructive"
    }

    # Require approval for medium-risk actions
    require_approval if {
        input.action.risk_score >= 0.5
        input.action.risk_score < 0.8
    }

    # Require approval for all destructive actions
    require_approval if {
        input.action.type == "destructive"
    }

    # Block extremely high-risk actions entirely
    deny if {
        input.action.risk_score >= 0.95
        input.action.type == "destructive"
        not input.emergency_override
    }

    # Allow with approval for high-risk actions
    allow if {
        input.action.risk_score >= 0.5
        input.approval.granted == true
        input.approval.approver != ""
    }

    # Specific action policies
    allow_iam_revoke if {
        input.action.type == "IAM_REVOKE"
        input.action.risk_score >= 0.7
        input.approval.granted == true
    }

    allow_pod_isolation if {
        input.action.type == "K8S_ISOLATE"
        input.action.risk_score >= 0.6
        input.approval.granted == true
    }

    # Audit requirements
    audit_required if {
        input.action.type == "destructive"
    }

    audit_required if {
        input.action.risk_score >= 0.5
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoc-opa
  namespace: asoc
  labels:
    app: asoc-opa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asoc-opa
  template:
    metadata:
      labels:
        app: asoc-opa
    spec:
      containers:
      - name: opa
        image: openpolicyagent/opa:latest
        ports:
        - containerPort: 8181
        args:
        - "run"
        - "--server"
        - "--addr=0.0.0.0:8181"
        - "--log-level=info"
        - "/policies"
        volumeMounts:
        - name: policy-volume
          mountPath: /policies
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8181
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8181
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: policy-volume
        configMap:
          name: opa-policy-config
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: asoc
spec:
  selector:
    app: asoc-opa
  ports:
  - protocol: TCP
    port: 8181
    targetPort: 8181
  type: ClusterIP
