apiVersion: apps/v1
kind: Deployment
metadata:
  name: asoc-dashboard
  namespace: asoc
  labels:
    app: asoc-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asoc-dashboard
  template:
    metadata:
      labels:
        app: asoc-dashboard
    spec:
      containers:
      - name: dashboard
        image: YOUR_REGISTRY/asoc-dashboard:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://asoc-backend:9002"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://asoc-backend:9002"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: asoc-dashboard
  namespace: asoc
spec:
  selector:
    app: asoc-dashboard
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asoc-dashboard-hpa
  namespace: asoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asoc-dashboard
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
