name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: asoc_test
          POSTGRES_USER: asoc
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: a-soc
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        working-directory: a-soc
        run: python -m black --check --line-length 120 .

      - name: Check imports (isort)
        working-directory: a-soc
        run: python -m isort --check-only --profile black --line-length 120 .

      - name: Run tests with coverage
        working-directory: a-soc
        env:
          DATABASE_URL: postgresql+asyncpg://asoc:testpass@localhost:5432/asoc_test
          WS_API_TOKEN: ci-test-token
        run: python -m pytest tests/ -v --cov --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: a-soc/coverage.xml
          fail_ci_if_error: false

  opa-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Run OPA tests
        working-directory: a-soc/guardrails/policies
        run: opa test . -v --coverage

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a-soc/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: a-soc/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: asoc_db
          POSTGRES_USER: asoc_user
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        working-directory: a-soc
        run: pip install -r requirements-lock.txt

      - name: Install Node deps
        working-directory: a-soc/dashboard
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        working-directory: a-soc/dashboard
        run: npx playwright install --with-deps chromium

      - name: Seed database
        env:
          DATABASE_URL: postgresql+asyncpg://asoc_user:testpass@localhost:5432/asoc_db
        run: python a-soc/scripts/run_migration.py

      - name: Start backend
        env:
          DATABASE_URL: postgresql+asyncpg://asoc_user:testpass@localhost:5432/asoc_db
          REDIS_URL: redis://localhost:6379/0
          HMAC_SECRET: ci-test-secret
          WS_API_TOKEN: ci-ws-token
        run: |
          cd a-soc
          python -m uvicorn src.asoc.api.app:app --host 0.0.0.0 --port 9002 &
          sleep 10
          curl -f http://localhost:9002/health

      - name: Start dashboard
        working-directory: a-soc/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:9002
          NEXT_PUBLIC_WS_URL: ws://localhost:9002
        run: |
          npm run build
          npm start &
          sleep 8
          curl -f http://localhost:3000

      - name: Run Playwright tests
        working-directory: a-soc/dashboard
        run: npx playwright test --reporter=github
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: a-soc/dashboard/playwright-report/
          retention-days: 7

  docker-compose-verify:
    name: Docker Compose Verification
    runs-on: ubuntu-latest
    needs: [test, opa-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        working-directory: a-soc
        run: |
          docker compose build --no-cache

      - name: Start full stack
        working-directory: a-soc
        run: |
          docker compose up -d
          sleep 30

      - name: Health check all services
        working-directory: a-soc
        run: |
          echo "=== Backend Health ==="
          curl -f http://localhost:9002/health

          echo ""
          echo "=== Dashboard ==="
          curl -f http://localhost:3000

          echo ""
          echo "=== PostgreSQL ==="
          docker exec asoc-postgres pg_isready -U asoc_user -d asoc_db

          echo ""
          echo "=== Redis ==="
          docker exec asoc-redis redis-cli ping

          echo ""
          echo "=== OPA ==="
          curl -f http://localhost:8181/health

          echo ""
          echo "=== All services healthy ==="

      - name: Run smoke tests
        working-directory: a-soc
        run: |
          PASS=0; FAIL=0
          check() { if eval "$2" >/dev/null 2>&1; then echo "PASS  $1"; PASS=$((PASS+1)); else echo "FAIL  $1"; FAIL=$((FAIL+1)); fi }

          TOKEN=$(curl -s -X POST http://localhost:9002/api/v1/auth/token -H 'Content-Type: application/json' -d '{"user_id":"admin","password":"admin123"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')

          check "Health" "curl -sf http://localhost:9002/health"
          check "Auth" "curl -sf -H 'Authorization: Bearer $TOKEN' http://localhost:9002/api/v1/auth/me"
          check "Stats" "curl -sf -H 'Authorization: Bearer $TOKEN' http://localhost:9002/api/v1/dashboard/stats"
          check "Incidents" "curl -sf -H 'Authorization: Bearer $TOKEN' http://localhost:9002/api/v1/incidents"
          check "Assets" "curl -sf -H 'Authorization: Bearer $TOKEN' http://localhost:9002/api/v1/assets"
          check "Agents" "curl -sf -H 'Authorization: Bearer $TOKEN' http://localhost:9002/api/v1/agents/status"
          check "Dashboard" "curl -sf http://localhost:3000"

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          [ $FAIL -eq 0 ] || exit 1

      - name: Collect logs on failure
        if: failure()
        working-directory: a-soc
        run: docker compose logs --tail=50
